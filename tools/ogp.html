<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  :root{--ink:#1b2330;--ink2:#222c3a;--rule:#3a475a;--paper:#ece6d6;--mute:#a3a9b4;--gold:#d9a441;--kaya:#e3be76;--kline:#5d4320;--piece:#f6e7bf;--pedge:#b98e47;--pink:#1d150a;--prom:#b8302a}
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:radial-gradient(120% 140% at 85% 50%,#26324a 0%,var(--ink) 60%);font-family:"Noto Sans CJK JP",sans-serif;color:var(--paper);overflow:hidden;position:relative}
  .left{position:absolute;left:80px;top:74px;width:660px}
  .kicker{font-size:26px;letter-spacing:.32em;color:var(--gold);font-weight:700}
  h1{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:80px;line-height:1.1;margin-top:18px;letter-spacing:.04em}
  h1 small{display:block;font-size:40px;font-weight:700;color:var(--mute);letter-spacing:.2em;margin-bottom:6px}
  .lead{margin-top:26px;font-size:27px;line-height:1.55;color:var(--paper)}
  .tags{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
  .tags span{border:2px solid var(--rule);border-radius:999px;padding:8px 20px;font-size:22px;color:var(--mute)}
  .tags span.on{border-color:var(--gold);color:var(--gold)}
  .url{position:absolute;left:84px;bottom:46px;font-size:24px;color:var(--mute);letter-spacing:.06em}
  .board{position:absolute;right:-150px;top:62px;width:520px;height:520px;background:var(--kaya);border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.45);transform:rotate(-6deg);
    background-image:linear-gradient(var(--kline) 2px,transparent 2px),linear-gradient(90deg,var(--kline) 2px,transparent 2px);background-size:57.8px 57.8px;background-position:-1px -1px}
  .pc{position:absolute;width:50px;height:54px;background:var(--piece);clip-path:polygon(50% 0,88% 16%,100% 100%,0 100%,12% 16%);display:flex;align-items:center;justify-content:center;padding-top:8px;
    font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:30px;color:var(--pink);filter:drop-shadow(0 2px 0 var(--pedge))}
  .pc.g{transform:rotate(180deg)}
  .pc.r{color:var(--prom)}
  .glow{position:absolute;width:57.8px;height:57.8px;background:rgba(217,164,65,.55)}
</style></head>
<body>
  <div class="left">
    <div class="kicker">BUSINESSMAKER</div>
    <h1><small>将棋</small>オンライン道場</h1>
    <p class="lead">ブラウザですぐ対局。登録なし・無料・指し放題。<br>AI感想戦で、一局ごとに強くなる。</p>
    <div class="tags"><span class="on">対局・観戦</span><span>AI感想戦</span><span>詰将棋250問</span><span>友達と対局</span></div>
  </div>
  <div class="url">shogi.businessmaker.net</div>
  <div class="board" id="b"></div>
<script>
  const b=document.getElementById('b'),S=57.8;
  const put=(x,y,ch,cls='')=>{const d=document.createElement('div');d.className='pc '+cls;d.textContent=ch;d.style.left=(x*S+4)+'px';d.style.top=(y*S+2)+'px';b.appendChild(d)};
  const glow=(x,y)=>{const d=document.createElement('div');d.className='glow';d.style.left=(x*S+1)+'px';d.style.top=(y*S+1)+'px';b.appendChild(d)};
  glow(2,2);
  put(1,0,'玉','g');put(0,0,'香','g');put(2,0,'金','g');put(1,1,'銀','g');put(0,2,'歩','g');put(3,2,'歩','g');put(4,1,'桂','g');
  put(2,2,'と','r');put(3,4,'角');put(5,3,'飛');put(1,4,'歩');put(4,5,'銀');put(6,6,'金');put(7,6,'玉');put(8,7,'香');put(5,5,'歩');put(7,5,'歩');
</script>
</body></html>
